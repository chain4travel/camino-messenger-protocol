syntax = "proto3";

package cmp.types.v3;

import "buf/validate/validate.proto";

// Address type that represents an EVM address in hex format
//
// Example: "0x1234567890abcdef1234567890abcdef12345678"
message EVMAddress {
  string address = 1 [(buf.validate.field).string = {
    len: 42 // Typical EVM address length is 42 characters (0x + 40 hex chars). Enforce exact length
    prefix: "0x" // Must start with 0x
    pattern: "^0x[0-9a-fA-F]{40}$" // 0x followed by exactly 40 hex characters
  }];
}
