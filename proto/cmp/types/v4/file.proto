syntax = "proto3";

package cmp.types.v4;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v4/file.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v4/file.proto.dot.svg)
message File {
  // file name
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 512
  }];

  // URI
  string uri = 2 [(buf.validate.field).string = {
    uri: true
    max_bytes: 2048
  }];

  // Last modification time
  //
  // Timestamps may be used for both off-chain and on-chain operations.
  // For on-chain operations, only seconds are supported, and nanoseconds
  // will be ignored.
  google.protobuf.Timestamp last_modified = 3;

  // Description
  string description = 4 [(buf.validate.field).string.max_bytes = 512];

  // MIME Type
  cmp.types.v4.MIMEType type = 5 [(buf.validate.field).enum.defined_only = true];

  // File size
  uint64 size = 6;

  // File checksum
  cmp.types.v4.Checksum checksum = 7;

  // Category
  string category = 8 [(buf.validate.field).string.max_bytes = 512];
}

message Image {
  // file
  cmp.types.v4.File file = 1 [(buf.validate.field).required = true];

  // Width
  uint32 width = 2;

  // Height
  uint32 height = 3;
}

message Video {
  // File
  cmp.types.v4.File file = 1 [(buf.validate.field).required = true];

  // Codec of video
  cmp.types.v4.Codec codec = 2 [(buf.validate.field).enum.defined_only = true];

  // Bitrate in kbps
  uint32 bitrate = 3;

  // Framerate
  uint32 framerate = 4;

  // Width and height are specified in pixels. Aspect ratio can be derived from that
  // Ex: "16:9"
  uint32 width = 5;
  uint32 height = 6;
}

// Codec formats
enum Codec {
  CODEC_UNSPECIFIED = 0;
  CODEC_H264 = 1; // H.264 (Advanced Video Coding)
  CODEC_HEVC = 2; // HEVC (H.265, High-Efficiency Video Coding)
  CODEC_VP9 = 3; // VP9
  CODEC_AV1 = 4; // AV1
  CODEC_MPEG2 = 5; // MPEG-2 (codec used for video on DVDs)
}

// File mime type
enum MIMEType {
  MIME_TYPE_UNSPECIFIED = 0;
  MIME_TYPE_OTHER = 1;
  MIME_TYPE_ABW = 2;
  MIME_TYPE_APNG = 3;
  MIME_TYPE_ARC = 4;
  MIME_TYPE_AVIF = 5;
  MIME_TYPE_AVI = 6;
  MIME_TYPE_AZW = 7;
  MIME_TYPE_BIN = 8;
  MIME_TYPE_BMP = 9;
  MIME_TYPE_BZ = 10;
  MIME_TYPE_BZ2 = 11;
  MIME_TYPE_CDA = 12;
  MIME_TYPE_CSH = 13;
  MIME_TYPE_CSS = 14;
  MIME_TYPE_CSV = 15;
  MIME_TYPE_DOC = 16;
  MIME_TYPE_DOCX = 17;
  MIME_TYPE_EOT = 18;
  MIME_TYPE_EPUB = 19;
  MIME_TYPE_GZ = 20;
  MIME_TYPE_GIF = 21;
  MIME_TYPE_HTM = 22;
  MIME_TYPE_ICO = 23;
  MIME_TYPE_ICS = 24;
  MIME_TYPE_JAR = 25;
  MIME_TYPE_JPEG = 26;
  MIME_TYPE_JS = 27;
  MIME_TYPE_JSON = 28;
  MIME_TYPE_JSONLD = 29;
  MIME_TYPE_MID = 30;
  MIME_TYPE_MJS = 31;
  MIME_TYPE_MP3 = 32;
  MIME_TYPE_MP4 = 33;
  MIME_TYPE_MPEG = 34;
  MIME_TYPE_MPKG = 35;
  MIME_TYPE_ODP = 36;
  MIME_TYPE_ODS = 37;
  MIME_TYPE_ODT = 38;
  MIME_TYPE_OGA = 39;
  MIME_TYPE_OGV = 40;
  MIME_TYPE_OGX = 41;
  MIME_TYPE_OPUS = 42;
  MIME_TYPE_OTF = 43;
  MIME_TYPE_PNG = 44;
  MIME_TYPE_PDF = 45;
  MIME_TYPE_PHP = 46;
  MIME_TYPE_PPT = 47;
  MIME_TYPE_PPTX = 48;
  MIME_TYPE_RAR = 49;
  MIME_TYPE_RTF = 50;
  MIME_TYPE_SH = 51;
  MIME_TYPE_SVG = 52;
  MIME_TYPE_TAR = 53;
  MIME_TYPE_TIFF = 54;
  MIME_TYPE_TS = 55;
  MIME_TYPE_TTF = 56;
  MIME_TYPE_TXT = 57;
  MIME_TYPE_VSD = 58;
  MIME_TYPE_WAV = 59;
  MIME_TYPE_WEBA = 60;
  MIME_TYPE_WEBM = 61;
  MIME_TYPE_WEBP = 62;
  MIME_TYPE_WOFF = 63;
  MIME_TYPE_WOFF2 = 64;
  MIME_TYPE_XHTML = 65;
  MIME_TYPE_XLS = 66;
  MIME_TYPE_XLSX = 67;
  MIME_TYPE_XML = 68;
  MIME_TYPE_XUL = 69;
  MIME_TYPE_ZIP = 70;
  MIME_TYPE_3GP = 71;
  MIME_TYPE_3G2 = 72;
  MIME_TYPE_7Z = 73;
  MIME_TYPE_AAC = 74;
}

message Checksum {
  // Hash algorithm
  cmp.types.v4.HashAlgorithm hash_algorithm = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Hash content in binary format
  bytes hash_binary = 2 [(buf.validate.field).bytes = {
    min_len: 16 // Minimum for MD5 (128 bits = 16 bytes)
    max_len: 64 // Maximum for SHA-512 (512 bits = 64 bytes)
  }];
}

// Hash algorithms
enum HashAlgorithm {
  HASH_ALGORITHM_UNSPECIFIED = 0;

  // Legacy/deprecated - No longer considered secure for cryptographic purposes
  HASH_ALGORITHM_MD5 = 1;
  HASH_ALGORITHM_SHA0 = 2;
  HASH_ALGORITHM_SHA1 = 3;

  // SHA-2 family hash functions
  HASH_ALGORITHM_SHA_224 = 4;
  HASH_ALGORITHM_SHA_256 = 5;
  HASH_ALGORITHM_SHA_384 = 6;
  HASH_ALGORITHM_SHA_512 = 7;
  HASH_ALGORITHM_SHA_512_224 = 8;
  HASH_ALGORITHM_SHA_512_256 = 9;

  // SHA-3 family hash functions
  HASH_ALGORITHM_SHA3_224 = 10;
  HASH_ALGORITHM_SHA3_256 = 11;
  HASH_ALGORITHM_SHA3_384 = 12;
  HASH_ALGORITHM_SHA3_512 = 13;

  // SHA-3 derived extendable-output functions (XOFs)
  HASH_ALGORITHM_SHAKE_128 = 14;
  HASH_ALGORITHM_SHAKE_256 = 15;

  // BLAKE family - High-performance cryptographic hash functions
  HASH_ALGORITHM_BLAKE2B = 16; // Optimized for 64-bit platforms
  HASH_ALGORITHM_BLAKE2S = 17; // Optimized for 32-bit platforms
  HASH_ALGORITHM_BLAKE3 = 18; // Modern high-performance hash

  // Other standardized hash functions
  HASH_ALGORITHM_RIPEMD_160 = 19; // Used in some blockchain implementations
  HASH_ALGORITHM_WHIRLPOOL = 20; // ISO standardized hash function
  HASH_ALGORITHM_SM3 = 21; // Chinese cryptographic standard

  // Keccak variants - Original Keccak, distinct from finalized SHA-3
  HASH_ALGORITHM_KECCAK_224 = 22;
  HASH_ALGORITHM_KECCAK_256 = 23;
  HASH_ALGORITHM_KECCAK_384 = 24;
  HASH_ALGORITHM_KECCAK_512 = 25;

  // SHA-3 competition finalists
  HASH_ALGORITHM_FSB = 26; // Fast Syndrome Based hash function
  HASH_ALGORITHM_JH = 27; // JH hash function
  HASH_ALGORITHM_GROESTL = 28; // Grøstl hash function
  HASH_ALGORITHM_SKEIN = 29; // Skein hash function
}
