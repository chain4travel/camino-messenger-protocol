syntax = "proto3";

package cmp.types.v1;

import "buf/validate/validate.proto";

// Token Reference
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v1/token.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v1/token.proto.dot.svg)
message TokenCurrency {
  string contract_address = 1 [(buf.validate.field).string = {
    len: 42 // Typical EVM address length is 42 characters (0x + 40 hex chars). Enforce exact length
    prefix: "0x" // Must start with 0x
    pattern: "^0x[0-9a-fA-F]{40}$" // 0x followed by exactly 40 hex characters
  }];
}

// Booking token that represents to access to the service
message BookingToken {
  // Contract address of the smart contract or the address of natively implemented
  // asset on-chain.
  string contract = 1 [(buf.validate.field).string = {
    len: 42 // Typical EVM address length is 42 characters (0x + 40 hex chars). Enforce exact length
    prefix: "0x" // Must start with 0x
    pattern: "^0x[0-9a-fA-F]{40}$" // 0x followed by exactly 40 hex characters
  }];

  // Token ID
  int32 token_id = 2 [(buf.validate.field).int32.gte = 0];
}
