syntax = "proto3";

package cmp.types.v4;

import "buf/validate/validate.proto";
import "cmp/types/v1/language.proto";
import "cmp/types/v4/description.proto";
import "cmp/types/v4/file.proto";
import "cmp/types/v4/localized.proto";
import "google/protobuf/wrappers.proto";

// Represents a basic seat with optional features and restrictions. Each seat has a
// unique identifier, a location within the seat map, and can have various static
// features and restrictions associated with it.
message Seat {
  // Unique identifier for the seat, such as "12B" or "A26". This identifier must be
  // unique within the section to which this seat belongs.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
  }];

  // The location of the seat within the seat map. This can be defined using either
  // a vector (SVG) or bitmap format.
  cmp.types.v4.SeatLocation location = 2;

  // Static features associated with the seat, such as type, amenities, etc.
  repeated cmp.types.v4.LocalizedSeatAttributeSet features = 3 [(buf.validate.field).repeated = {
    max_items: 100 // Default max items
  }];

  // Restrictions associated with the seat, such as age limits or accessibility requirements.
  repeated cmp.types.v4.LocalizedSeatAttributeSet restrictions = 4 [(buf.validate.field).repeated = {
    max_items: 100 // Default max items
  }];
}

// List of seats
message SeatList {
  repeated cmp.types.v4.Seat seats = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10000
  }];
}

// A Section represents a distinct area within a venue, which can be defined by
// various attributes. It can be a block of rows in a theater, a specific area in a
// concert venue such as the stage or standing area, a section of seating in a
// stadium, or a section in an airplane. Each Section is uniquely identified and can
// contain information about its seats, layout, and additional properties.
message Section {
  // Level, section or row identifier, e.g., "Upper", "Balcony" or "Section 101",
  // "Orchestra" or "A", "12". Must be unique for each section.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
  }];

  // List of localized names Human readable names of the section
  repeated cmp.types.v4.LocalizedString names = 2 [(buf.validate.field).repeated = {
    max_items: 100 // Default max items
  }];

  // Seats in this section.
  oneof seat_info {
    option (buf.validate.oneof).required = true;

    // List of seats in this section.
    cmp.types.v4.SeatList seat_list = 3;

    // Total number of seats in this section as an integer.
    google.protobuf.Int32Value seat_count = 4 [(buf.validate.field).int32 = {gt: 0}]; // TODO: Check if this rule makes it impossible to select seat_list from this oneof.
  }

  // Image that provides a visual representation of the section's layout, which can
  // be either a vector (SVG) or bitmap image.
  //
  // If set, it is assumed that this image is used for locating seats within the
  // section. (the `SeatLocation` message type in the `Seat` message above is
  // used to represent seat location inside this image).
  cmp.types.v4.Image image = 5;

  // A list of localized descriptions for this section, useful for providing
  // information about features and amenities in multiple languages.
  repeated cmp.types.v4.LocalizedDescriptionSet descriptions = 6 [(buf.validate.field).repeated = {
    max_items: 100 // Default max items
  }];

  // Nested sections within this section, allowing for a hierarchical representation
  // of the venue's layout.
  repeated cmp.types.v4.Section sections = 7 [(buf.validate.field).repeated = {
    max_items: 100 // Default max items
  }];
}

// High-level representation of a seat map, which defines the layout and structure
// of seating within a venue. This message provides a comprehensive overview of the
// seating arrangement, including sections, images, and localized descriptions.
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v4/seat_map.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v4/seat_map.proto.dot.svg)
message SeatMap {
  // Unique identifier for the seat map
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
  }];

  // A list of sections within the seat map. Each section represents a distinct area
  // within the venue, such as rows, sections, levels, or blocks of seats. This
  // field is recursive, allowing for hierarchical structuring of the seating
  // layout.
  repeated cmp.types.v4.Section sections = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100 // Default max items
  }];

  // Image that provides a visual representation of the seat map, illustrating the
  // location and arrangement of seats. The image can be in vector format (SVG) or
  // bitmap format.
  cmp.types.v4.Image image = 3;

  // A list of localized descriptions for the seat map. This can be used to describe
  // features and amenities of the seating arrangement in multiple languages.
  // The languages should match those requested in SeatMapRequest
  repeated cmp.types.v4.LocalizedDescriptionSet descriptions = 4 [(buf.validate.field).repeated = {
    max_items: 100 // Default max items
  }];
}

// List of _only_ seat IDs to be used for seat selection or seat availability.
message SeatInventory {
  // List of seat IDs
  repeated string ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {
        min_len: 1
        max_bytes: 64
      }
    }
  }];
}

// Represents the inventory of seats for a specific section and all its inner
// sections. This message is used for both seat availability and seat selection
// purposes, providing information about either the remaining or selected seats
// within the section.
message SectionInventory {
  // Unique identifier for the section. Must be unique within the seat map.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
  }];

  oneof seat_info {
    option (buf.validate.oneof).required = true;

    // List of individual seat IDs within this section.
    cmp.types.v4.SeatInventory seat_list = 2;

    // Seat count in this section, representing either the remaining seats for
    // availability purposes or the selected seats for seat selection messages.
    //
    // This field is intended for sections without individual seat details, such as
    // standing areas at a concert or an arena.
    google.protobuf.Int32Value seat_count = 3 [(buf.validate.field).int32.gt = 0]; // Minimum 1 seat
  }

  // Nested inner sections within this section, allowing for a hierarchical
  // representation of seat inventory. Each inner section can have its own seat
  // information and further nested sections.
  repeated cmp.types.v4.SectionInventory sections = 4 [(buf.validate.field).repeated = {
    max_items: 100 // Default max items
  }];
}

// Represents the inventory of seats for a specific seat map, used for both seat
// selection and seat availability purposes. This message provides a comprehensive
// overview of the seating inventory, including detailed information about each
// section and its inner sections.
message SeatMapInventory {
  // Unique identifier for the seat map that this Inventory refers to.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
  }];

  // A list of seat inventories for each section within the seat map. This field
  // includes detailed seat information and supports nested sections, allowing for a
  // hierarchical representation of the seating arrangement.
  repeated cmp.types.v4.SectionInventory sections = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100 // Default max items
  }]; // Minimum 1 section inventory
}

message LocalizedSeatAttributeSet {
  cmp.types.v1.Language language = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  repeated cmp.types.v4.SeatAttribute seat_attributes = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100 // Default max items
  }];
}

/* Helper messages */

// Defines a static attribute for a seat, which can be used for specifying features
// and restrictions. Attributes include a name, a human-readable description, and a
// value that can be used for various conditions or restrictions.
//
// FIXME: Can we make this a big enum?
message SeatAttribute {
  // Name of the attribute, used to identify the feature or restriction.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 512
  }];

  // Human-readable description of the attribute, providing more details about its purpose.
  string description = 2 [(buf.validate.field).string = {
    min_len: 0
    max_bytes: 512
  }];

  // Integer value associated with the attribute, which can be used for conditions
  // or restrictions, such as "min_age".
  int32 value = 3;
}

// Enumerates the geometric shapes used to define clickable regions for seats
// in a bitmap image seat map (see `BitmapSeatLocation`).
// These types generally correspond to the `shape` attribute of an HTML `<area>` tag.
enum AreaType {
  AREA_TYPE_UNSPECIFIED = 0; // Default, should not be used (enforced by validation).
  AREA_TYPE_RECTANGLE = 1; // A rectangular area.
  AREA_TYPE_CIRCLE = 2; // A circular area.
  AREA_TYPE_POLYGON = 3; // A polygonal area (defined by a set of vertices).
}

// Defines the location of a seat as a clickable area within a bitmap image
// (e.g., PNG, JPG) seat map. This information is typically used to generate
// HTML `<area>` tags for an image map, making regions of the image interactive.
message BitmapSeatLocation {
  // Specifies the geometric shape of the seat's clickable area (e.g., rectangle,
  // circle, polygon). This determines how the `coordinates` field is interpreted.
  // Must be a defined `AreaType` other than `AREA_TYPE_UNSPECIFIED`.
  cmp.types.v4.AreaType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // A list of integer coordinates defining the shape of the seat area on the
  // bitmap image. The interpretation of these coordinates depends on the `type`
  // field and generally corresponds to the `coords` attribute of an HTML `<area>`
  // tag.
  //
  // Examples based on `AreaType`:
  // - `AREA_TYPE_RECTANGLE`: Expects 4 coordinates: `[x1, y1, x2, y2]`,
  //   representing the top-left (x1,y1) and bottom-right (x2,y2) corners.
  //   HTML equivalent: `<area shape="rect" coords="x1,y1,x2,y2">`
  // - `AREA_TYPE_CIRCLE`: Expects 3 coordinates: `[centerX, centerY, radius]`.
  //   HTML equivalent: `<area shape="circle" coords="centerX,centerY,radius">`
  // - `AREA_TYPE_POLYGON`: Expects at least 6 coordinates (for a triangle):
  //   `[x1, y1, x2, y2, x3, y3, ..., xN, yN]`, representing the vertices of
  //   the polygon. The polygon is automatically closed by connecting the last
  //   point to the first if not explicitly done.
  //   HTML equivalent: `<area shape="poly" coords="x1,y1,x2,y2,...,xN,yN">`
  //
  // The `min_items: 3` validation is minimum for circle areas; however, the
  // actual minimum number of coordinates depends on the `type`:
  //   - Rectangle: 4 coordinates
  //   - Circle: 3 coordinates
  //   - Polygon: 6 coordinates (for a minimal triangle)
  // `max_items` limits the complexity, e.g., for very detailed polygons.
  repeated int32 coordinates = 2 [(buf.validate.field).repeated = {
    min_items: 3 // Actual minimum depends on AreaType (e.g., 3 for circle).
    max_items: 100 // Limits complexity of polygons.
  }];
}

// Defines the location or identifier of a seat within an SVG (Scalable Vector
// Graphics) seat map. This is typically used to reference a specific element
// (e.g., by its ID or a custom attribute) within the SVG document that
// represents the seat.
message VectorSeatLocation {
  // The identifier (e.g., an ID, class name, or custom data attribute value)
  // of the SVG element representing the seat. This label is used to
  // programmatically find and interact with the seat's representation in the SVG.
  // Example: "seat-A1", "section-TERRACE-row-26-seat-34", "path1234".
  string label = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 512
  }];
}

// Represents the location of a single seat within a seat map.
// A seat's location can be defined either for a vector-based (SVG) map
// or a raster/bitmap image map. Exactly one type of location must be provided.
message SeatLocation {
  // Defines the seat location using one of the supported map formats.
  // This field is mandatory; either `vector` or `bitmap` must be set.
  oneof location {
    option (buf.validate.oneof).required = true;

    // Location details for a seat in an SVG (vector) seat map.
    cmp.types.v4.VectorSeatLocation vector = 1;

    // Location details for a seat in a bitmap image seat map (e.g., PNG, JPG),
    // typically used with HTML image maps.
    cmp.types.v4.BitmapSeatLocation bitmap = 2;
  }
}
