syntax = "proto3";

package cmp.types.v4;

import "buf/validate/validate.proto";

// Amenity message type
//
// Examples:
//
// - Amenity message with a single attribute
//
// ```python
// Amenity(
//     type = AmenityType.AMENITY_TYPE_THEMES,
//     attributes = {
//         "theme": "Second-line beach hotel"
//     }
// )
// ```
//
// - Amenity message with multiple attributes
//
// ```python
// Amenity(
//     type = AmenityType.AMENITY_TYPE_INTERNET,
//     attributes = {
//         "lobby": "WiFi",
//         "charge": "extra fee",
//         "fee": "20",
//         "fee_unit": "EUR"
//     }
// )
// ```
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v4/amenity.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v4/amenity.proto.dot.svg)
message Amenity {
  // Amenity type like INTERNET, POOL, FOOD_BEVERAGE
  cmp.types.v4.AmenityType type = 1 [(buf.validate.field).enum = {
    // Only allow defined types
    defined_only: true
    // Do not allow UNSPECIFIED
    not_in: [0]
  }];

  // Attributes of the amenity
  map<string, string> attributes = 2; // FIXME: Needs discussion
}

enum AmenityType {
  AMENITY_TYPE_UNSPECIFIED = 0;
  AMENITY_TYPE_FOOD_AND_DRINK = 1;
  AMENITY_TYPE_POOL = 2;
  AMENITY_TYPE_BEACH = 3;
  AMENITY_TYPE_ATTRACTIONS = 4;
  AMENITY_TYPE_THEMES = 5;
  AMENITY_TYPE_INTERNET = 6;
  AMENITY_TYPE_OTHER = 99;
}
