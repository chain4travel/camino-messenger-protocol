syntax = "proto3";

package cmp.types.v4;

import "buf/validate/validate.proto";
import "cmp/types/v4/credit_card.proto";

// Additional payment info message with currently only a single field of
// `CreditCard` message type.
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v3/payment.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v3/payment.proto.dot.svg)
message AdditionalPaymentInfo {
  cmp.types.v4.CreditCard credit_card = 1;
}

// Payment Types
enum PaymentType {
  PAYMENT_TYPE_UNSPECIFIED = 0;
  PAYMENT_TYPE_OTHER = 1;
  PAYMENT_TYPE_BANK_TRANSFER = 2;
  PAYMENT_TYPE_CREDIT_CARD = 3;
  PAYMENT_TYPE_PAYPAL = 4;
  PAYMENT_TYPE_CRYPTO_CARD = 5;
}

message OffChainPayment {
  // Payment ID
  string payment_id = 1 [(buf.validate.field).string.min_len = 1];

  // Payment Type. It can be Bank transfer, Credit card, ... etc
  cmp.types.v4.PaymentType payment_type = 2 [(buf.validate.field).enum.defined_only = true];
}
