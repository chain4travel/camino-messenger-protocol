syntax = "proto3";

package cmp.types.v4;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Represents a specific period of time defined by a start and an end date-time.
//
// This message uses precise timestamps, making it suitable for scenarios
// requiring exact date and time boundaries, including timezone considerations
// inherent in the `google.protobuf.Timestamp` type (which represents UTC).
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v4/datetime_range.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v4/datetime_range.proto.dot.svg)
message DateTimeRange {
  // The inclusive start date and time of the range.
  //
  // This timestamp can be used for both off-chain and on-chain operations. When
  // used for on-chain operations, typically only the seconds component of the
  // timestamp is relevant, and any nanosecond precision might be ignored or
  // truncated by the blockchain.
  google.protobuf.Timestamp start = 1 [(buf.validate.field).required = true];

  // The **exclusive** end date and time of the range. It is expected that `end` is
  // later than or equal to `start`.
  // The end date is exclusive because it allows for representing ranges that
  // naturally align with common time intervals. For example, a range from
  // `2024-01-01T00:00:00Z` to `2024-01-02T00:00:00Z` clearly indicates that the range
  // includes all moments on January 1st, 2024, but does not include any part of
  // January 2nd, 2024. This exclusivity is particularly useful in scheduling
  // and booking systems where end times often signify the start of a new period.
  //
  // Similar to `start`, this timestamp can be used for both off-chain and on-chain
  // operations. For on-chain use, nanosecond precision may not be supported, with
  // only the seconds component being considered.
  google.protobuf.Timestamp end = 2 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "end must be on/after start"
    expression: "this.end >= this.start"
  };
}
