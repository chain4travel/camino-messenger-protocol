syntax = "proto3";

package cmp.types.v4;

import "buf/validate/validate.proto";

// Link is used to represent websites, social media contact, online check-in url, ... etc
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v4/link.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/types/v4/link.proto.dot.svg)
message Link {
  // Link type
  cmp.types.v4.LinkType type = 1 [(buf.validate.field).enum.defined_only = true];

  // Link description
  //
  // Ex: "Baggage conditions"
  string description = 2 [(buf.validate.field).string = {
    min_len: 0
    max_bytes: 512
  }];

  // Link reference, a URI.
  //
  // Ex: "https://api.lyko.tech/v2.1/transfers/ebaa9aed-dbc4-4d51-a41a-336a3c3e9bfc/pdf-terms-and-conditions"
  string ref = 3 [(buf.validate.field).string.uri = true];
}

enum LinkType {
  LINK_TYPE_UNSPECIFIED = 0;
  LINK_TYPE_WEBSITE = 1;
  LINK_TYPE_CHECKIN = 2;
  LINK_TYPE_BOOKING = 3;
  LINK_TYPE_SUPPORT = 4;
  LINK_TYPE_FEEDBACK = 5;
  LINK_TYPE_COMPLAINT = 6;
  LINK_TYPE_FACEBOOK = 7;
  LINK_TYPE_INSTAGRAM = 8;
  LINK_TYPE_X = 9;
  LINK_TYPE_LINKEDIN = 10;
  LINK_TYPE_DISCORD = 11;
  LINK_TYPE_MEDIUM = 12;
  LINK_TYPE_TIKTOK = 13;
  LINK_TYPE_WHATSAPP = 14;
  LINK_TYPE_TELEGRAM = 15;
}
