syntax = "proto3";

package cmp.types.v4;

import "buf/validate/validate.proto";
import "cmp/types/v4/date.proto";

message CreditCard {
  // A creditcard should be stored as a string to facilitate cards that have leading
  // zeros, but also to allow for spaces or dashes for readability, like for example
  // 1234-5678-9876-5432
  string number = 1 [(buf.validate.field).string = {
    // FIXME: Comment above says it should allow spaces and dashes. Is that a good idea? Why not enforce a common format?
    min_len: 12
    max_len: 19
  }];

  cmp.types.v4.Date expiration_date = 2 [(buf.validate.field).required = true];

  uint32 cvc = 3 [(buf.validate.field).uint32 = {
    lte: 9999 // FIXME: check
  }];
}
