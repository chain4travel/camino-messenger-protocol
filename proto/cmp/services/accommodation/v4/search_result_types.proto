syntax = "proto3";

package cmp.services.accommodation.v4;

import "buf/validate/validate.proto";
import "cmp/services/accommodation/v4/unit_types.proto";
import "cmp/types/v4/bookability.proto";
import "cmp/types/v4/cancel_policy.proto";
import "cmp/types/v4/price.proto";
import "cmp/types/v4/rate.proto";

// This type represents a search result and is used in the
// `AccommodationSearchResponse` message.
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/accommodation/v3/search_result_types.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/accommodation/v3/search_result_types.proto.dot.svg)
message AccommodationSearchResult {
  // ID for the search result. This is an increasing number starting at 0 and
  // increasing by 1 for every search result.
  //
  // Must be unique within a response. This is used as identifier for validation in
  // the next step of the booking.
  uint32 result_id = 1;

  // This field represents the query ID associated with the search result.
  uint32 query_id = 2;

  // Units for this search result
  repeated cmp.services.accommodation.v4.Unit units = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];

  // Represents the complete pricing information for a product or service, including
  // both the total price value and an optional breakdown of price components.
  cmp.types.v4.TotalPrice total_price = 4 [(buf.validate.field).required = true];

  // The RateRule specifies whether a search result is non-refundable or not
  repeated cmp.types.v4.RateRule rate_rules = 5 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // The cancellation conditions related to an option
  cmp.types.v4.CancelPolicy cancel_policy = 6 [(buf.validate.field).required = true];

  // Free text remarks without any functionality. Only for display purposes. Should
  // be in the requested language.
  string remarks = 7 [(buf.validate.field).string.max_bytes = 512];

  // Status of the result, whether it is immediately bookable or not
  cmp.types.v4.Bookability bookability = 8 [(buf.validate.field).required = true];
}
