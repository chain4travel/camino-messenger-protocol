syntax = "proto3";

package cmp.services.accommodation.v4;

import "buf/validate/validate.proto";
import "cmp/services/accommodation/v4/property_types.proto";
import "cmp/types/v1/language.proto";
import "cmp/types/v4/common.proto";
import "cmp/types/v4/product_code.proto";
import "google/protobuf/timestamp.proto";

message AccommodationProductInfoRequest {
  // Message header
  cmp.types.v4.RequestHeader header = 1 [(buf.validate.field).required = true];

  // Only respond with the products that are modified after this timestamp
  //
  // Timestamps may be used for both off-chain and on-chain operations.
  // For on-chain operations, only seconds are supported, and nanoseconds
  // will be ignored.
  google.protobuf.Timestamp modified_after = 2; // FIXME: Does this makes sense when we have supplier code list?

  // Languages
  repeated cmp.types.v1.Language languages = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
    unique: true
  }];

  // Property codes
  repeated cmp.types.v4.SupplierProductCode supplier_codes = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100 // Default max items
  }];
}

message AccommodationProductInfoResponse {
  // Message header
  cmp.types.v4.ResponseHeader header = 1 [(buf.validate.field).required = true];

  // Product list: Properties
  repeated cmp.services.accommodation.v4.PropertyExtendedInfo properties = 2 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100 // Default max items
  }];
}

// Accommodation product info service definition
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/accommodation/v3/info.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/accommodation/v3/info.proto.dot.svg)
//
/// @custom:cmp-service type:product routing:p2p on-chain:false
service AccommodationProductInfoService {
  // Returns product list for accommodation (properties)
  rpc AccommodationProductInfo(AccommodationProductInfoRequest) returns (AccommodationProductInfoResponse);
}
