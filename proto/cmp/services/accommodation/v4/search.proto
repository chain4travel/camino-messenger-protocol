syntax = "proto3";

// ## Accommodation Services
//
// The Accommodation services are used for both hotels and holiday homes, often
// called short term rentals.
//
// Just like any search message response in the Camino Messenger Protocol, the
// "AccommodationSearch" only includes dynamic data. Static data can be cached
// and kept up to data with the Product List and Product Details messages.
//
// The Accommodation service also has the "ShortList" service, which only returns
// the supplier codes. It can be used without the "modified_after" parameter to
// obtain a full list of all codes for a specific supplier, but the intention is
// usage with the "modified_after" set, to refresh updated products and create a
// list of new and discontinued products.
//
// The workflow to onboard and update properties is as follows:
// * The list of new/updated properties is received via the ShortList request.
// * The products which are not yet mapped by the distributor can be obtained via
//   the ProductList request.
// * The products which are already mapped and needs to be updated in the
//   distributor system shall be requested via the ProductInfo request
//
// The more extensive Accommodation Product List is meant to include all details
// required to map a new property with more details like location, rating, to
// which chain it belongs, address, airports, etc.
// This is being used to decide whether or not this product shall become a
// property sold by the distributor.
//
// Both the "ShortList" and the "ProductList" service contain a status field
// with either "activated" or "deactivated" values, so that Distributors can
// take the properties that are no longer supplied, off-sale for the specific
// Supplier.
//
// Once we have mapped the property we need to download all details. Multiple
// languages can be specified. In case a Distributor requests an unsupported
// language in the request, the supplier should not include that language and
// include a warning in the response. I.e: a Distributor specifies EN, DE, FR
// and NL, the supplier does not support NL and includes descriptions in EN, DE
// and FR, and adding a warning that "NL" is not supported.
//
// Finally, the purchase process that is the same for all message types, can be
// initiated: (Accommodation)Search, Validate, Mint and Cancel.
package cmp.services.accommodation.v4;

import "buf/validate/validate.proto";
import "cmp/services/accommodation/v4/search_query_types.proto";
import "cmp/services/accommodation/v4/search_result_types.proto";
import "cmp/types/v4/common.proto";
import "cmp/types/v4/search.proto";
import "cmp/types/v4/traveller.proto";
import "cmp/types/v4/uuid.proto";

// The `Accommodation Search Request` message type facilitates the request for
// accommodations like hotel and holiday home searches within the platform. In the
// request the market, language and currency are specified at the top-level.
//
// In "queries" we specify the details of the trip like dates, properties or
// locations or filters. The purpose of such a structure is to allow for multi-room
// and multi-property search requests.
//
// For the response this means that there is no grouping of different
// room, mealplan or rateplan options in single room or single property searches.
// Each AccommodationSearchResult is one bookable option as a "result_id".
//
// Simple example:
// a search for 1 room for 2 adults would be just 1 query, with one travel period and
// one set of search parameters. The response has one query_id with many result_ids
// for various rooms, mealplans and rateplans in one hotel and depending on the search
// parameters, again for other hotels. Each property+room+rateplan+mealplan is one
// result_id with just one unit.
//
// The simple example is also applicable for holiday homes where one or multiple
// result_ids will be returned for various homes matching the query. The results will
// probably not include a mealplan and in general no room information as all rooms in
// the home are included. Flexible and non-refundable as well as packaging rateplans
// are already surfacing in some distribution channels.
//
// Multi room example:
// a search for 1 room for 2 adults in one query and another room for two adults and a
// child of 8 in another room in the same hotel or destination for the same dates in
// another query in the search request. This will lead to a search response with just
// one unit for every possible option available for each query_id, with many result_ids.
//
// The same concept is valid for multiple homes for more than one family traveling
// together to one park or destination.
//
// Road-trip or circuit example:
// a search for one or multiple rooms or homes in queries that have sequential dates
// and destinations. For example a trip to Las Vegas, a flight to New York and descending
// the atlantic coastline to New Orleans or Orlando by car with stops in various places.
//
// The hostel, convention or groups example:
// Often just 5 rooms for 10 people are requested or specific bed combinations like 5
// single-use rooms (for 5 travellers) and 5 double rooms (10 travellers) are requested.
// In this case the number of rooms is specified and the total amount of travellers,
// but no distribution of travellers per room is detailed in the request. The response
// then hold multiple units for one search_id and result_id, so that if 5 rooms are
// requested, but only 2 standard rooms are available, the requested amount can be
// completed with a different room type (superior, seaview,..)
//
// In general, the number of available rooms should be considered to ensure that for
// requests with multiple rooms or homes, the same room or home is not offered twice
// to different travellers.
//
message AccommodationSearchRequest {
  // Common header which is used in every request.
  cmp.types.v4.RequestHeader header = 1 [(buf.validate.field).required = true];

  // Generic search parameters Ex: Inclusion of OnRequest options and inclusion of
  // only the cheapest or all options.
  // In the search parameters multiple filters can be applied for upfront filtering
  // of the search results to for example to only include hotels that are less than
  // one kilometer from the beach, have a kids club and offer an a la carte restaurant
  cmp.types.v4.SearchParameters search_parameters = 2 [(buf.validate.field).required = true];

  // This field represents a list of search queries that can be used to create
  // multiroom multi location searches.
  repeated cmp.services.accommodation.v4.AccommodationSearchQuery queries = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
}

// The `Accommodation Search Response` message type facilitates the response for
// accommodations like hotel and holiday home searches within the platform.
//
// In the response a search_id must be included and a search_option_id for every
// bookable option responded. Included, compulsory and optional services can be
// included. A simple "free cancellation upto" can be set or full cancellation
// policies can be included.
message AccommodationSearchResponse {
  // Common response header used in every response.
  cmp.types.v4.ResponseHeader header = 1 [(buf.validate.field).required = true];

  // Search_id to be used in subsequent requests like the "Validation Request".
  cmp.types.v4.UUID search_id = 2 [(buf.validate.field).required = true];

  // Unique combinations of bookable search results
  repeated cmp.services.accommodation.v4.AccommodationSearchResult results = 3 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 10000
  }];

  // Global definition of the travellers for all results to be used via the
  // traveller_id in each unit.
  repeated cmp.types.v4.BasicTraveller travellers = 4 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 15
  }];
}

// Service definition for Accommodation search
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/accommodation/v4/search.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/accommodation/v4/search.proto.dot.svg)
//
/// @custom:cmp-service type:product routing:p2p on-chain:false
service AccommodationSearchService {
  // Accommodation Search method
  rpc AccommodationSearch(AccommodationSearchRequest) returns (AccommodationSearchResponse);
}
