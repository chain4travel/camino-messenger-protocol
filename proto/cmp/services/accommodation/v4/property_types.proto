syntax = "proto3";

package cmp.services.accommodation.v4;

import "buf/validate/validate.proto";
import "cmp/types/v1/product_status.proto";
import "cmp/types/v4/amenity.proto";
import "cmp/types/v4/bed.proto";
import "cmp/types/v4/contact_info.proto";
import "cmp/types/v4/description.proto";
import "cmp/types/v4/file.proto";
import "cmp/types/v4/location.proto";
import "cmp/types/v4/meal_plan.proto";
import "cmp/types/v4/product_code.proto";
import "cmp/types/v4/service_fact.proto";
import "cmp/types/v4/traveller.proto";
import "google/protobuf/timestamp.proto";

// Represents property info for an accommodation product
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/accommodation/v3/property_types.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/accommodation/v3/property_types.proto.dot.svg)
message Property {
  // Ex: "2023-08-28T12:03:50", specifying when the static data of a product was
  // last updated
  //
  // Timestamps may be used for both off-chain and on-chain operations.
  // For on-chain operations, only seconds are supported, and nanoseconds
  // will be ignored.
  google.protobuf.Timestamp last_modified = 1 [(buf.validate.field).required = true];

  // Supplier product Code
  cmp.types.v4.SupplierProductCode supplier_code = 2 [(buf.validate.field).required = true];

  // Product code which can be of different types
  repeated cmp.types.v4.ProductCode product_codes = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 500
  }];

  // Ex: "Beach Hotel Alanya"
  string name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 512
  }];

  // Ex: "Hilton"
  string chain = 5 [(buf.validate.field).string.max_bytes = 512];

  // Ex: CATEGORY_RATING_4_5
  cmp.services.accommodation.v4.CategoryRating category_rating = 6;

  // Ex: CATEGORY_UNIT_PALMS
  cmp.services.accommodation.v4.CategoryUnit category_unit = 7;

  // Contact Info: phone, address, email, links
  cmp.types.v4.ContactInfo contact_info = 8 [(buf.validate.field).required = true];

  // Location coordinate
  cmp.types.v4.Coordinates coordinates = 9 [(buf.validate.field).required = true];

  // Status of the property
  cmp.types.v1.ProductStatus status = 10 [(buf.validate.field).required = true];

  // Airports
  // Ex: ["PMI", "ZRH", "AYT"]
  // FIXME: Have another msg type for airports
  repeated string airports = 11 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 10
    items: {
      string: {max_len: 4}
    }
  }];

  // If category_rating is provided, category_unit must also be provided
  option (buf.validate.message).cel = {
    id: "category_rating_unit_dependency"
    message: "If category_rating is provided, category_unit must also be provided"
    expression: "this.category_rating == cmp.services.accommodation.v4.CategoryRating.CATEGORY_RATING_UNSPECIFIED || this.category_unit != cmp.services.accommodation.v4.CategoryUnit.CATEGORY_UNIT_UNSPECIFIED"
  };

  // Property contact_info must have at least one address
  option (buf.validate.message).cel = {
    id: "contact_info_address_required"
    message: "Property contact_info must have at least one address"
    expression: "size(this.contact_info.addresses) > 0"
  };
}

enum CategoryRating {
  CATEGORY_RATING_UNSPECIFIED = 0;
  CATEGORY_RATING_0_5 = 1;
  CATEGORY_RATING_1_0 = 2;
  CATEGORY_RATING_1_5 = 3;
  CATEGORY_RATING_2_0 = 4;
  CATEGORY_RATING_2_5 = 5;
  CATEGORY_RATING_3_0 = 6;
  CATEGORY_RATING_3_5 = 7;
  CATEGORY_RATING_4_0 = 8;
  CATEGORY_RATING_4_5 = 9;
  CATEGORY_RATING_5_0 = 10;
  CATEGORY_RATING_5_5 = 11;
  CATEGORY_RATING_6_0 = 12;
  CATEGORY_RATING_6_5 = 13;
  CATEGORY_RATING_7_0 = 14;
  CATEGORY_RATING_7_5 = 15;
  CATEGORY_RATING_8_0 = 16;
  CATEGORY_RATING_8_5 = 17;
  CATEGORY_RATING_9_0 = 18;
  CATEGORY_RATING_9_5 = 19;
  CATEGORY_RATING_10_0 = 20;
}

enum CategoryUnit {
  CATEGORY_UNIT_UNSPECIFIED = 0;
  CATEGORY_UNIT_STARS = 1;
  CATEGORY_UNIT_PALMS = 2;
}

// This message type contains extended info about a property
message PropertyExtendedInfo {
  // Property
  cmp.services.accommodation.v4.Property property = 1 [(buf.validate.field).required = true];

  // Images
  repeated cmp.types.v4.Image images = 2 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Videos
  repeated cmp.types.v4.Video videos = 3 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Segmentation classification
  //
  // TODO: Improve (multiple enums like location type, guest type, etc)
  repeated string classifications = 4 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
    items: {
      string: {max_bytes: 512}
    }
  }];

  // Property descriptions
  repeated cmp.types.v4.LocalizedDescriptionSet localized_descriptions = 5 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Room descriptions
  repeated cmp.types.v4.LocalizedDescriptionSet localized_room_descriptions = 6 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Payment type. Ex: "MERCHANT"
  //
  // TODO: Reevaluate & make this an enum if needed
  string payment_type = 7 [(buf.validate.field).string.max_bytes = 512];

  // Rooms
  repeated cmp.services.accommodation.v4.Room rooms = 8 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

message Room {
  // Room code of the unit in case of hotel. Ex: "RMSDDB0000". For holiday homes
  // often no room codes are used. This code must explicitly match the supplier_room_code
  // in the ProductList and the ProductInfo messages, so that the static data like room
  // amenities, descriptions, images etc. can be married to the dynamic price and
  // availability data for display to the end user.
  string supplier_code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 512
  }];

  // Room name. In case of hotel a standardized room name is often derived from
  // room code structures. Example: "superior sea view room".
  // For holiday homes we expect names like "Master Bedroom", "Second Bedroom" or
  // "Bathroom" when specific descriptions for each room are available.
  string supplier_name = 2 [(buf.validate.field).string.max_bytes = 512];

  // Original room name as assigned by the hotel. In case of specifically designated room
  // names by chains and both the chain and the customer wants to adhere to them.
  // Ex: "CEIBA CLUB", "CEIBA GOVERNORS SUITE", "GOVERNORS SUITE" or "ENCLAVE NATURE VIEW"
  // For holiday homes specific room names if available can be given.
  string original_name = 3 [(buf.validate.field).string.max_bytes = 512];

  repeated cmp.types.v4.Image images = 4 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  repeated cmp.types.v4.Video videos = 5 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Room descriptions
  repeated cmp.types.v4.LocalizedDescriptionSet descriptions = 6 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Meal plan (Board code)
  repeated cmp.types.v4.MealPlan meal_plans = 7 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Beds
  repeated cmp.types.v4.Bed beds = 8 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Occupancy
  cmp.services.accommodation.v4.Occupancy total_occupancy = 9;

  // Services
  repeated cmp.types.v4.ServiceFact services = 10 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Amenities
  repeated cmp.types.v4.Amenity amenities = 11 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];
}

message Occupancy {
  // Min guests
  uint32 min_guests = 1 [(buf.validate.field).uint32 = {gt: 0}];

  // Max guests
  uint32 max_guests = 2 [(buf.validate.field).uint32 = {gt: 0}];

  // Standard occupancy
  uint32 standard_occupancy = 3;

  // If infants are counted in total guests or not
  bool infant_counted_in_total_guests = 4;

  // Occupancy options
  repeated cmp.services.accommodation.v4.OccupancyOption occupancy_options = 5 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Max guests must be greater than or equal to min guests
  option (buf.validate.message).cel = {
    id: "max_guests_gte_min_guests"
    message: "max_guests must be greater than or equal to min_guests"
    expression: "this.max_guests >= this.min_guests"
  };

  // Standard occupancy must be between min guests and max guests if provided (if it's zero then it's not provided)
  option (buf.validate.message).cel = {
    id: "standard_occupancy_range"
    message: "If standard_occupancy is provided (> 0), it must be between min_guests and max_guests"
    expression: "this.standard_occupancy == 0u || (this.standard_occupancy >= this.min_guests && this.standard_occupancy <= this.max_guests)"
  };
}

// TODO: Explain this type
message OccupancyOption {
  // Guest type like adult, child, infant.
  cmp.types.v4.TravellerType guest_type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Min guests
  uint32 min = 2;

  // Max guests
  uint32 max = 3 [(buf.validate.field).uint32 = {gt: 0}];

  // Min age
  uint32 min_age = 4;

  // Max age
  uint32 max_age = 5;

  // Max guests must be greater than or equal to min guests
  option (buf.validate.message).cel = {
    id: "max_guests_gte_min_guests"
    message: "max must be greater than or equal to min"
    expression: "this.max >= this.min"
  };

  // Max age must be greater than or equal to min age
  option (buf.validate.message).cel = {
    id: "max_age_gte_min_age"
    message: "max_age must be greater than or equal to min_age"
    expression: "this.max_age >= this.min_age"
  };

  // If guest_type is not ADULT, max_age must be greater than zero
  // FIXME: Shouldn't there be a min_age rule also (for seniors for example)?
  option (buf.validate.message).cel = {
    id: "max_age_required_for_non_adults"
    message: "If guest_type is not ADULT, max_age must be greater than zero"
    expression: "this.guest_type == cmp.types.v4.TravellerType.TRAVELLER_TYPE_ADULT || this.max_age > 0"
  };
}
