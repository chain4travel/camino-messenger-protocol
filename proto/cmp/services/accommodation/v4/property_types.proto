// Represents a transport hub (like an airport or train station) in the vicinity of the property.
message TransportHub {
  // Location code of the transport hub which can be IATA or ICAO for airports
  // or something different for trains, etc.
  cmp.types.v4.LocationCode location_code = 1 [(buf.validate.field).required = true];

  // Distance from the property to the transport hub
  cmp.types.v4.Length distance = 2 [(buf.validate.field).required = true];

  // Estimated travel time from the property to the transport hub in minutes
  cmp.types.v4.Duration travel_time = 3 [(buf.validate.field).required = true];
}
