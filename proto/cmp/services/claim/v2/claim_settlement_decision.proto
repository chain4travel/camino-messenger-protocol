syntax = "proto3";

package cmp.services.claim.v2;

import "buf/validate/validate.proto";
import "cmp/services/claim/v2/claim_types.proto";
import "cmp/types/v4/common.proto";
import "cmp/types/v4/price.proto";
import "google/protobuf/timestamp.proto";

// Request to submit a claim settlement decision
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/claim/v2/claim_settlement_decision.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/claim/v2/claim_settlement_decision.proto.dot.svg)
message ClaimSettlementDecisionRequest {
  // Message header
  cmp.types.v4.RequestHeader header = 1 [(buf.validate.field).required = true];

  // Only respond with the products that are new, modified or deactivated after this
  // timestamp.
  //
  // Timestamps may be used for both off-chain and on-chain operations.
  // For on-chain operations, only seconds are supported, and nanoseconds
  // will be ignored.
  google.protobuf.Timestamp modified_after = 2;

  // Claim ID: Submission ID, Processing ID and Carrier ID
  cmp.services.claim.v2.ClaimId claim_id = 3;

  // Claim Status
  cmp.services.claim.v2.ClaimStatus status = 4;

  // TODO: Is this reference applied for Acceptance and Rejection ?
  string decision_reference = 5 [(buf.validate.field).string.max_bytes = 512];

  // More info about decision such as rejection reason.
  string decision_detail = 6 [(buf.validate.field).string.max_bytes = 512];

  // Pay-out transaction
  cmp.services.claim.v2.PayOutTransaction payout_transaction = 7;

  // Amount
  // TODO: Is it possible that there are multiple payouts for different parties
  // in one claim?
  cmp.types.v4.PriceDetail amount = 8;
}

message ClaimSettlementDecisionResponse {
  // Message header
  cmp.types.v4.ResponseHeader header = 1 [(buf.validate.field).required = true];

  // Claim Message Response to respond with claim ids (processing, carrier and submission) and message status
  cmp.services.claim.v2.ClaimMessageResponse claim_message_response = 2;
}
