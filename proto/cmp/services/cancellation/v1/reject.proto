syntax = "proto3";

package cmp.services.cancellation.v1;

import "cmp/services/cancellation/v1/reason.proto";
import "cmp/types/v1/common.proto";
import "cmp/types/v3/evm_transaction.proto";

// Request for cancellation rejection
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/cancellation/v1/reject.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/cancellation/v1/reject.proto.dot.svg)
message RejectCancellationRequest {
  // Request Header
  cmp.types.v1.RequestHeader header = 1;

  // Booking token ID this request is for
  uint64 token_id = 2;

  // Reason for rejection
  cmp.services.cancellation.v1.RejectionReason reason = 3;
}

// Response for cancellation rejection
message RejectCancellationResponse {
  // Response Header
  cmp.types.v1.ResponseHeader header = 1;

  // Transaction ID on-chain for the cancellation proposal rejection.
  //
  // This transaction can be verified on-chain to:
  // 1. Prove the exact time of the rejection
  // 2. Validate the rejection reason
  // 3. Prevent disputes about the cancellation
  cmp.types.v3.EVMTransactionID transaction_id = 2;
}
