syntax = "proto3";

package cmp.services.activity.v4;

import "buf/validate/validate.proto";
import "cmp/types/v1/language.proto";
import "cmp/types/v4/duration.proto";
import "cmp/types/v4/price_range.proto";
import "cmp/types/v4/product_code.proto";

// These are Activity specific search parameters
//
// ## Supplier-Specific Requirements
// While all fields in this message are optional at the message level, each supplier
// may define their own minimum set of required filter parameters.
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/activity/v2/search_parameters_types.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/activity/v2/search_parameters_types.proto.dot.svg)
message ActivitySearchParameters {
  // Specify the language(s) a potential guide should speak for example a tour in
  // the Anne Frank house in Amsterdam in French or the tour at the pyramids in
  // Egypt should be in Russian
  repeated cmp.types.v1.Language spoken_languages = 1 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Specify one or more supplier codes to be included in the search response
  // These must match the supplier codes provided in the ProductList and
  // ProductInfo messages
  repeated cmp.types.v4.SupplierProductCode supplier_codes = 2 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 500
  }];

  // Specify one or more product codes to be included in the search response
  // These can be of different types
  repeated cmp.types.v4.ProductCode product_codes = 3 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 500
  }];

  // Specify one or more unit IDs to be included in the search response
  // The purpose of this concept is to allow for different activities for one product
  // like "Windsurfing" and "Kitesurfing" under "Salou Playa Llarga".
  // Code and description match the information provided in the ProductList and
  // ProductInfo message. These are in general also supplier specific.
  repeated string unit_codes = 4 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
    items: {
      string: {max_bytes: 512}
    }
  }];

  // Specify one or more service codes to be included in the search response
  // Several different packages could be included like "Windsurfing" with or without
  // "Wetsuit". Code and description match the information provided in the ProductInfo message
  // These are in general also supplier specific
  repeated string service_codes = 5 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
    items: {
      string: {max_bytes: 512}
    }
  }];

  // The minimum and maximum duration of an activity to be included in the
  // search response
  cmp.types.v4.DurationRange duration_range = 6;

  // The minimum and maximum price of an activity to be included in the
  // search response
  cmp.types.v4.PriceRange price_range = 7;
}
