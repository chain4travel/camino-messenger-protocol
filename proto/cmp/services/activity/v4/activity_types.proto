syntax = "proto3";

package cmp.services.activity.v4;

import "buf/validate/validate.proto";
import "cmp/types/v1/delivery.proto";
import "cmp/types/v1/language.proto";
import "cmp/types/v1/redemption.proto";
import "cmp/types/v4/address.proto";
import "cmp/types/v4/bookability.proto";
import "cmp/types/v4/contact_info.proto";
import "cmp/types/v4/datetime_range.proto";
import "cmp/types/v4/description.proto";
import "cmp/types/v4/duration.proto";
import "cmp/types/v4/file.proto";
import "cmp/types/v4/location.proto";
import "cmp/types/v4/product_code.proto";
import "google/protobuf/timestamp.proto";

// Activity
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/activity/v3/activity_types.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/activity/v3/activity_types.proto.dot.svg)
message Activity {
  // Context for Inventory system concepts that need to be included in an info
  // response, like an OwnerCode, PTC_OfferParameters, Tax codes, Disclosure RefID,
  // etc. or a serialized combination of these codes.
  string context = 1 [(buf.validate.field).string.max_bytes = 512];

  // Ex: "2023-08-28T12:03:50", specifying when the static data of a product was
  // last updated
  //
  // Timestamps may be used for both off-chain and on-chain operations.
  // For on-chain operations, only seconds are supported, and nanoseconds
  // will be ignored.
  google.protobuf.Timestamp last_modified = 2;

  // An identifier for external sessions, aiding in tracking and continuity across
  // sessions.
  string external_session_id = 3 [(buf.validate.field).string.max_bytes = 512];

  // External Product codes for the result. These can be of different types
  cmp.types.v4.ProductCode product_code = 4;

  // Unit ID for the result
  //
  // The purpose of this concept is to allow for different activities for one
  // product like "Windsurfing" and "Kitesurfing" under "Salou Playa Llarga". Code
  // and description match the information provided in the ProductList and
  // ProductInfo message. These are in general also supplier specific.
  string unit_code = 5 [(buf.validate.field).string.max_bytes = 512];

  // Service codes for the result
  //
  // Several different packages could be included like "Windsurfing" with or without
  // "Wetsuit". Code and description match the information provided in the
  // ProductInfo message These are in general also supplier specific.
  string service_code = 6 [(buf.validate.field).string.max_bytes = 512];

  // Status of the result, whether it is immediately bookable or not
  cmp.types.v4.Bookability bookability = 7;
}

message ActivityLocation {
  // Ex: Ctra. de la Porrassa, s/n, Magaluf, ES 07181 in structured fields
  cmp.types.v4.Address address = 1;

  // Geo Tree. Country, region, city_or_resort
  cmp.types.v4.GeoTree geo_tree = 2;

  // Coordinate
  cmp.types.v4.Coordinates coordinates = 3;
}

message PickupDropoffEvent {
  // Supplier specific pick-up code. Avoid using this and use a more generic concept
  // where possible, so that the integration is suitable for more than one partner.
  //
  // Ex: "AESPMI43NU",
  string location_code = 1 [(buf.validate.field).string.max_bytes = 512];
  // Ex: "Sunny Beach Hotel",
  string location_name = 2 [(buf.validate.field).string.max_bytes = 512];

  // True if this pickup location is selected for the activity
  //
  // If the boolean is set to false, this is a specific indication that
  // pick-up/drop-off at this location is not possible. An activity search response
  // can have one result without a transfer service and without a PickupDropoffEvent
  // to indicate that there is no transfer included. Or a PickupDropoffEvent with
  // pick_up indicator set to false can be included to make it explicit.
  bool pickup_indicator = 3;

  // Ex: "OTHERS / Parking Varadero (bus stop css nº50)",
  string other_info = 4 [(buf.validate.field).string.max_bytes = 512];

  // Datetime of the pickup dropoff event as Unix timestamp
  //
  // Timestamps may be used for both off-chain and on-chain operations.
  // For on-chain operations, only seconds are supported, and nanoseconds
  // will be ignored.
  google.protobuf.Timestamp date_time = 5;

  // Longitude and Latitude of the location
  cmp.types.v4.Coordinates coordinates = 6;
}

// Activity static info
message ActivityExtendedInfo {
  // Activity dynamic info references
  cmp.services.activity.v4.Activity activity = 1;

  // Available Units
  repeated cmp.services.activity.v4.ActivityUnit units = 2 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Available Services
  repeated cmp.services.activity.v4.ActivityService services = 3 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Transfer Zone(s) in which participants of the activity can be used for pick-up
  // and drop-off
  repeated cmp.services.activity.v4.TransferZone zones = 4 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Descriptions with different languages
  repeated cmp.types.v4.LocalizedDescriptionSet descriptions = 5 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Coordinates of where the activity takes place
  cmp.services.activity.v4.ActivityLocation location = 6;

  // Activity Features
  repeated cmp.services.activity.v4.ActivityFeature features = 7 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Tags
  repeated cmp.services.activity.v4.ActivityTag tags = 8 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Languages
  repeated cmp.types.v1.Language languages = 9 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Contact Info; Address, Email, Phone, Urls
  cmp.types.v4.ContactInfo contact_info = 10;

  // Images
  repeated cmp.types.v4.Image images = 11 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Videos
  repeated cmp.types.v4.Video videos = 12 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Supplier code from the Inventory System for this activity response.
  string supplier_unit_code = 13 [(buf.validate.field).string.max_bytes = 512];

  // Activity Category Code
  string category_code = 14 [(buf.validate.field).string.max_bytes = 512];

  // Category name which describes the category_code
  string category_name = 15 [(buf.validate.field).string.max_bytes = 512];

  // Type Code
  string type_code = 16 [(buf.validate.field).string.max_bytes = 512];

  // Type name which describes type_code
  string type_name = 17 [(buf.validate.field).string.max_bytes = 512];

  // Supplier Product codes for the result
  // These must match the supplier codes provided in the ProductList and
  // ProductInfo messages
  cmp.types.v4.SupplierProductCode supplier_code = 18;

  // Supplier Name
  string supplier_code_name = 19 [(buf.validate.field).string.max_bytes = 512];

  // Duration range (min, max) of the activity in minutes
  cmp.types.v4.DurationRange duration_range = 20;

  // Time given for confirmation before the offer expires
  cmp.types.v4.Duration max_confirmation_duration = 21;

  // Allow Free Sale
  bool allow_free_sale = 22;

  // The ability to confirm instantly
  bool instant_confirmation = 23;

  // Can be delivered instantly
  bool instant_delivery = 24;

  // Check availability
  bool availability_required = 25;

  // Availability Type
  string availability_type = 26 [(buf.validate.field).string.max_bytes = 512];

  // Delivery Formats; such as QR Code, NFT, Ticket, ... etc
  repeated cmp.types.v1.DeliveryFormat delivery_formats = 27 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Delivery Methods; such as Email, SMS, Post, ... etc
  repeated cmp.types.v1.DeliveryMethod delivery_methods = 28 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];

  // Redemption method
  repeated cmp.types.v1.RedemptionMethod redemption_methods = 29 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];
}

// The unit  gives us a choice of the different options that are available in an
// activity, like for example a normal ticket or a VIP ticket. a 2 hour or 4 hour
// jeep safari. A ticket to a specific section of a stadium.
message ActivityUnit {
  //Schedule
  cmp.types.v4.DateTimeRange schedule = 1;

  // Unit Code
  string code = 2 [(buf.validate.field).string.max_bytes = 512];

  // Unit Name
  string name = 3 [(buf.validate.field).string.max_bytes = 512];

  // Unit Description
  string description = 4 [(buf.validate.field).string.max_bytes = 512];
}

// Services can be selected like do we go to the activity by ourselves or is a
// transfer from our hotel included. Do we book the VIP ticket with or without
// alcoholic drinks included?
message ActivityService {
  // Service Code
  string code = 1 [(buf.validate.field).string.max_bytes = 512];

  // Service Name
  string name = 2 [(buf.validate.field).string.max_bytes = 512];

  // Service Description
  string description = 3 [(buf.validate.field).string.max_bytes = 512];

  // Included items in the activity service
  repeated string included = 4 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
    items: {
      string: {max_bytes: 512}
    }
  }];

  // Excluded items in the activity service
  repeated string excluded = 5 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
    items: {
      string: {max_bytes: 512}
    }
  }];
}

message TransferZone {
  // Zone Code used in transfer operations
  string code = 1 [(buf.validate.field).string.max_bytes = 512];

  // Geo tree type, represented by Country, Region, and City_or_Resort.
  cmp.types.v4.GeoTree geo_tree = 2;

  // pick-up and drop-off information about location and time
  repeated cmp.services.activity.v4.PickupDropoffEvent pickup_dropoff_events = 3 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];
}

message ActivityFeature {
  // Feature description
  string description = 1 [(buf.validate.field).string.max_bytes = 512];

  // Feature Code
  string code = 2 [(buf.validate.field).string.max_bytes = 512];
}

message ActivityTag {
  // active status
  bool active = 1;

  // Unique ID
  int32 id = 2;

  // Name
  string name = 3 [(buf.validate.field).string.max_bytes = 512];

  // Slug; giving an informal name to the tag
  string slug = 4 [(buf.validate.field).string.max_bytes = 512];
}
