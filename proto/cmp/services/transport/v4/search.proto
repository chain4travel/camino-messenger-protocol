syntax = "proto3";

// ## Transport Service
//
// The Transport Service is used for flights, trains, and buses.
//
// Any search message response in the Camino Messenger Protocol only includes
// dynamic data. Static data can be cached and kept up to date with the Product List
// and Product Details messages.
//
// This package is a WIP.
package cmp.services.transport.v4;

import "buf/validate/validate.proto";
import "cmp/services/transport/v4/search_query_types.proto";
import "cmp/services/transport/v4/search_result_types.proto";
import "cmp/types/v1/content_source.proto";
import "cmp/types/v4/common.proto";
import "cmp/types/v4/search.proto";
import "cmp/types/v4/traveller.proto";
import "cmp/types/v4/uuid.proto";

// Transport Search Request
message TransportSearchRequest {
  // Message header. Contains API version, message info string and end-user wallet
  // address
  cmp.types.v4.RequestHeader header = 1 [(buf.validate.field).required = true];

  // Generic search parameters
  // Ex: Inclusion of OnRequest options and inclusion of only the cheapest or all
  // options.
  cmp.types.v4.SearchParameters search_parameters = 2 [(buf.validate.field).required = true];

  // Multiple search queries for this search request
  repeated cmp.services.transport.v4.TransportSearchQuery queries = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
}

message TransportSearchSuccessResponse {
  // Message header. Contains API version, message info string and end-user wallet
  // address
  cmp.types.v4.SuccessResponseHeader header = 1 [(buf.validate.field).required = true];

  // Search_id to be used in subsequent requests like the "Validation Request".
  cmp.types.v4.ExpiringUUID search_id = 2 [(buf.validate.field).required = true];

  // Content source types for this search request.
  //
  // Ex: ContentSourceType.CONTENT_SOURCE_TYPE_GDS,
  // ContentSourceType.CONTENT_SOURCE_TYPE_NDC
  // ContentSourceType.CONTENT_SOURCE_TYPE_3RD_PARTY
  repeated cmp.types.v1.ContentSourceType content_source_types = 3 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];

  // Transit search results
  repeated cmp.services.transport.v4.TransportSearchResult results = 4 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 10000
  }];

  // Global definition of the travellers for all results to be used via the traveller_id
  repeated cmp.types.v4.BasicTraveller travellers = 5 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 15
  }];
}

message TransportSearchErrorResponse {
  // Common error response header used in every error response.
  cmp.types.v4.ErrorResponseHeader header = 1 [(buf.validate.field).required = true];
}

message TransportSearchResponse {
  oneof response {
    option (buf.validate.oneof).required = true; // One must be provided
    cmp.services.transport.v4.TransportSearchSuccessResponse success_response = 1;
    cmp.services.transport.v4.TransportSearchErrorResponse error_response = 2;
  }
}

// Transport Search Service definition.
//
// Takes `TransportSearchRequest` message type and returns `TransportSearchResponse`
// message type.
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/transport/v4/search.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/transport/v4/search.proto.dot.svg)
//
/// @custom:cmp-service type:product routing:p2p on-chain:false
service TransportSearchService {
  rpc TransportSearch(TransportSearchRequest) returns (TransportSearchResponse);
}
