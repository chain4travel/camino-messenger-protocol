syntax = "proto3";

package cmp.services.notification.v2;

import "cmp/services/cancellation/v1/reason.proto";
import "cmp/types/v1/uuid.proto";
import "cmp/types/v3/evm_address.proto";
import "cmp/types/v3/evm_transaction.proto";
import "google/protobuf/empty.proto";

// Notification service for different events that the partner should be notified about
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/notification/v2/notify.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/notification/v2/notify.proto.dot.svg)
//
/// @custom:cmp-service type:product routing:local on-chain:true
service NotificationService {
  rpc TokenBoughtNotification(TokenBought) returns (google.protobuf.Empty);
  rpc TokenExpiredNotification(TokenExpired) returns (google.protobuf.Empty);
  rpc CancellationPendingNotification(CancellationPending) returns (google.protobuf.Empty);
  rpc CancellationWithdrawnNotification(CancellationWithdrawn) returns (google.protobuf.Empty);
  rpc CancellationRejectedNotification(CancellationRejected) returns (google.protobuf.Empty);
  rpc CancellationFinalizedNotification(CancellationFinalized) returns (google.protobuf.Empty);
}

// Related on-chain event:
//
// ```solidity
// event TokenBought(uint256 indexed tokenId, address indexed buyer);
// ```
message TokenBought {
  uint64 token_id = 1;
  cmp.types.v3.EVMTransactionID tx_id = 2;
  cmp.types.v1.UUID mint_id = 3;
}

// Related on-chain event:
//
// ```solidity
// event TokenExpired(uint256 indexed tokenId);
// ```
message TokenExpired {
  uint64 token_id = 1;
  cmp.types.v3.EVMTransactionID tx_id = 2;
  cmp.types.v1.UUID mint_id = 3;
}

// Related on-chain events:
//
// ```solidity
// event CancellationPending(
//   uint256 indexed tokenId,
//   address indexed initialProposer,
//   address indexed currentProposer,
//   uint256 refundAmount,
//   bool ownerAccepted,
//   bool supplierAccepted,
//   uint32 timesCountered,
//   uint32 timesRejected
// );
//
// event CancellationReasons(
//   uint256 indexed tokenId,
//   uint16 cancellationReason,
//   uint16 cancellationReasonVersion,
//   uint16 rejectionReason,
//   uint16 rejectionVersion,
//   uint16 counterReason,
//   uint16 counterVersion,
//   uint16 withdrawalReason,
//   uint16 withdrawalVersion
// );
// ```
message CancellationPending {
  uint64 token_id = 1;
  cmp.types.v3.EVMAddress initial_proposer = 2;
  cmp.types.v3.EVMAddress current_proposer = 3;
  uint64 refund_amount = 4;
  bool owner_accepted = 5;
  bool supplier_accepted = 6;
  uint64 times_countered = 7;
  uint64 times_rejected = 8;

  cmp.types.v3.EVMTransactionID tx_id = 9;

  // Reasons
  cmp.services.cancellation.v1.CancellationReason cancellation_reason = 10;
  cmp.services.cancellation.v1.RejectionReason rejection_reason = 11;
  cmp.services.cancellation.v1.CounterReason counter_reason = 12;
  cmp.services.cancellation.v1.WithdrawalReason withdrawal_reason = 13;
}

// Related on-chain event:
//
// ```solidity
// event CancellationWithdrawn(uint256 indexed tokenId, uint16 withdrawalReason, uint16 withdrawalVersion);
// ```
message CancellationWithdrawn {
  uint64 token_id = 1;
  cmp.services.cancellation.v1.WithdrawalReason reason = 2;
  cmp.types.v3.EVMTransactionID tx_id = 3;
}

// Related on-chain event:
//
// ```solidity
// event CancellationRejected(uint256 indexed tokenId, uint16 rejectionReason, uint16 rejectionVersion);
// ```
message CancellationRejected {
  uint64 token_id = 1;
  cmp.services.cancellation.v1.RejectionReason reason = 2;
  cmp.types.v3.EVMTransactionID tx_id = 3;
}

// Related on-chain event:
//
// ```solidity
// event CancellationFinalized(uint256 indexed tokenId);
// ```
message CancellationFinalized {
  uint64 token_id = 1;
  cmp.types.v3.EVMTransactionID tx_id = 2;
}
